# Built-in harness definition for Claude Code.
# Values fixed in specs/001-aprofile-standalone-profile-cli/research.md item 1.
# Isolation lever: CLAUDE_CONFIG_DIR relocates the whole config dir (settings,
# projects, plugins, .claude.json, .credentials.json) and keys the macOS Keychain
# entry per config dir (research V1).
name: claude
binary: claude
wrapper_prefix: claude

# One redirect: CLAUDE_CONFIG_DIR points at the profile root itself.
config_env:
  CLAUDE_CONFIG_DIR: "."

default_config_location: "~/.claude"
model_var: ANTHROPIC_MODEL
endpoint_var: ANTHROPIC_BASE_URL
omarchy_provider: anthropic
plugin_mechanism: "enabledPlugins in settings.json"

capabilities: [login, oauth-token, native-profiles, mcp]

# Env-based auth is the safe default (per-profile, Keychain-independent).
default_auth_kind: auth-token
auth_kinds:
  - name: api-key
    vars: { ANTHROPIC_API_KEY: ref }
  - name: auth-token
    vars: { ANTHROPIC_AUTH_TOKEN: ref }
  - name: oauth-token
    vars: { CLAUDE_CODE_OAUTH_TOKEN: ref }
  - name: oauth-login
    vars: {} # interactive login; credentials land in the Keychain / .credentials.json

classification:
  - { entry: ".credentials.json", layer: credentials }
  - { entry: "projects/", layer: state }
  - { entry: "statsig/", layer: state }
  - { entry: "logs/", layer: state }
  - { entry: "history/", layer: state }
  - { entry: "skills/", layer: owned }
  # .claude.json is a mixed file: account keys are credentials, mcpServers is
  # owned, project trust and start counts are state.
  - entry: ".claude.json"
    layer: mixed
    keys:
      oauthAccount: credentials
      account: credentials
      mcpServers: owned
      projects: state
      numStartups: state
  # Everything else is shared (symlinked to the default setup).
  - { entry: "*", layer: shared }

mcp:
  location: ".claude.json#mcpServers"
  flavor: claude-json

skills_location:
  path: "skills"
  scope: per-profile
