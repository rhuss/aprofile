# Built-in harness definition for Codex (OpenAI's coding CLI).
# Values fixed in specs/001-aprofile-standalone-profile-cli/research.md item 4 and
# the plan's cross-cutting config_env decision.
# Isolation lever: CODEX_HOME relocates the whole Codex config dir (auth.json,
# sessions, history, logs, config.toml, skills) into the profile root.
name: codex
binary: codex
wrapper_prefix: codex

# One redirect: CODEX_HOME points at the profile root itself.
config_env:
  CODEX_HOME: "."

default_config_location: "~/.codex"
# Codex has no dedicated model env var (model is set in config.toml or via the
# `--model` flag, which passes through the wrapper). Endpoint follows the OpenAI
# SDK convention Codex honors.
endpoint_var: OPENAI_BASE_URL
omarchy_provider: openai
plugin_mechanism: "config.toml"

capabilities: [login, native-profiles, mcp]

# ChatGPT login (credentials in auth.json, cleanly isolated by CODEX_HOME) is the
# default; an API key via OPENAI_API_KEY is the env-based alternative.
default_auth_kind: chatgpt-login
auth_kinds:
  - name: chatgpt-login
    vars: {} # interactive login; credentials land in auth.json
  - name: api-key
    vars: { OPENAI_API_KEY: ref }

classification:
  # Entries verified on disk with Codex CLI 0.166.0 on 2026-11-04
  # (specs/002-profile-isolation-levels/research.md R1). No catch-all (FR-001).
  - { entry: "auth.json", layer: credentials }
  - { entry: "auth.lock", layer: credentials }
  # config.toml holds mcp_servers plus model/provider settings. It is TOML, which
  # the mixed-file merge does not support, so the whole file is owned per profile at
  # every level, all included (FR-009a).
  - { entry: "config.toml", layer: owned }
  # Runtime state (FR-003). Every *.sqlite database covers its -wal/-shm/-journal
  # and .lock companions (FR-004).
  - { entry: "sessions/", layer: state }
  - { entry: "history.jsonl", layer: state }
  - { entry: "session_index.jsonl", layer: state }
  - { entry: "session_index.jsonl.lock", layer: state }
  - { entry: "log/", layer: state }
  - { entry: "*.sqlite", layer: state }
  - { entry: ".sqlite-maintenance.lock", layer: state }
  - { entry: "app-server-control/", layer: state }
  - { entry: "app-server-daemon/", layer: state }
  - { entry: "thread-writer-locks/", layer: state }
  - { entry: "shell_snapshots/", layer: state }
  - { entry: "tui-thread-reference-capabilities/", layer: state }
  - { entry: "cache/", layer: state }
  - { entry: "tmp/", layer: state }
  - { entry: ".tmp/", layer: state }
  - { entry: "models_cache.json", layer: state }
  - { entry: "version.json", layer: state }
  - { entry: "installation_id", layer: state }
  - { entry: ".personality_migration", layer: state }
  - { entry: ".sandbox_migration", layer: state }
  # Content.
  - { entry: "AGENTS.md", layer: content }
  - { entry: "prompts/", layer: content }
  - { entry: "skills/", layer: content }
  # Codex writes "always allow" decisions into rules/default.rules at runtime.
  - { entry: "rules/", layer: settings }
  # Installed plugin code.
  - { entry: "plugins/", layer: plugin-store }
  - { entry: "packages/", layer: plugin-store }

# hooks.json has the same event-groups shape as Claude Code's hooks key. It is an
# entry of its own, so at all it is linked to the default setup's file.
hooks:
  location: "hooks.json#hooks"
  form: event-groups

# Codex also reads ~/.agents/skills relative to $HOME (research.md item 4).
home_escapes:
  - { path: "~/.agents/skills", what: "skills" }

mcp:
  location: "config.toml#mcp_servers"
  flavor: codex-toml

skills_location:
  path: "skills"
  scope: per-profile # ignored since feature 002: skills are content
