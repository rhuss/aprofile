rules:
- glob: docs/guide/plan.md
  require: ["Historical create plan", "evolved guide specification", "plans/2026-11-08-evolve.md"]
  forbid: ["\\u2013|\\u2014"]
- glob: docs/README.md
  require: ["^## What you get$", "^## What the parts are$", "^## How they fit$", "^## Ways to run it$", "^## Status and limits$", "^## Where to go next$", "history-groups\\.md"]
  forbid: ["\\u2013|\\u2014"]
  require_order: ["^## What you get$", "^## What the parts are$", "^## How they fit$", "^## Ways to run it$", "^## Status and limits$", "^## Where to go next$"]
- glob: docs/overview/profile-basics.md
  require: ["^## Why this matters$", "^## What a profile is$", "^## What stays private$", "^## What a share level changes$", "history group", "history-groups\\.md"]
  forbid: ["\\u2013|\\u2014"]
  require_order: ["^## Why this matters$", "^## What a profile is$", "^## What stays private$", "^## What a share level changes$"]
- glob: docs/user/getting-started.md
  require: ["^## Build aprofile$", "^## Create a profile$", "^## Sync and launch$", "isolated", "history-groups\\.md", "aprofile-go-minimum"]
  forbid: ["\\u2013|\\u2014", "sk-[A-Za-z0-9]{8,}", "ghp_[A-Za-z0-9]{8,}"]
  require_order: ["^## Build aprofile$", "^## Create a profile$", "^## Sync and launch$"]
- glob: docs/user/share-levels.md
  require: ["`all`", "`content`", "`none`", "credentials", "runtime state", "^### History and sessions$", "ungrouped", "grouped", "history-groups\\.md", "within one harness", "OpenCode"]
  forbid: ["\\u2013|\\u2014"]
  require_order: ["^## Choose a level$", "^## What each level shares$", "^## Limits to know$"]
- glob: docs/user/history-groups.md
  require: ["home", "--group", "--no-group", "OpenCode"]
  forbid: ["\\u2013|\\u2014"]
  require_order: ["^## Choose who shares history$", "^## Create and join a group$", "^## Resume in another member$", "^## Leave a group$", "^## Limits and recovery$"]
- glob: docs/user/manage-profiles.md
  require: ["aprofile list", "aprofile show", "aprofile edit", "aprofile copy", "aprofile sync", "hook-sets", "mcp copy", "login <harness>/<name>", "--group", "history-groups\\.md", "never carries source history", "rename.*refused", "credential", "--purge", "imported credential files"]
  forbid: ["\\u2013|\\u2014"]
  require_order: ["^## Inspect profiles$", "^## Change profiles$", "^## Copy profile data$", "^## Manage hooks and MCP servers$"]
- glob: docs/user/troubleshooting.md
  require: ["aprofile show", "aprofile doctor", "PATH", "unclassified", "history-groups.md", "history group", "group membership", "set-aside", "manifest", "auth-status", "orphan", "temporary", "sync --relink"]
  forbid: ["\\u2013|\\u2014"]
  require_order: ["^## Inspect the profile$", "^## Run doctor$", "^## Follow a reported fix$"]
- glob: docs/reference/commands.md
  require: ["aprofile add", "aprofile list", "aprofile show", "aprofile edit", "aprofile sync", "aprofile doctor", "--help", "aprofile group list", "aprofile group show", "aprofile group create", "aprofile group delete", "cannot be renamed.*aprofile group rename", "--group", "--no-group", "history-groups\\.md"]
  forbid: ["\\u2013|\\u2014"]
  require_order: ["^## Profile commands$", "^## Sharing, hooks, and MCP$", "^## Diagnostics and help$"]
